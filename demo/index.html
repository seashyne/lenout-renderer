<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mellow — Triangle Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080b10;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 16px;
    }
    canvas {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
    }
    #info {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    #tier {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>
  <div id="info">
    Mellow Renderer — Tier: <span id="tier">detecting…</span>
  </div>
  <script type="module">
    import { createMellowRenderer, detectMellowCapabilities } from "../dist/mellowRenderer.js";

    const canvas = document.getElementById("canvas");
    const tierEl = document.getElementById("tier");

    const caps = await detectMellowCapabilities();
    tierEl.textContent = caps.tier;

    const renderer = await createMellowRenderer(canvas);
    renderer.start();

    // Keep alive
    window.addEventListener("beforeunload", () => renderer.destroy());
  </script>
</body>
</html>
